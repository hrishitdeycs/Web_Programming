<!DOCTYPE html>
<html>
<head>
    <title>Linking Example</title>
    <style>
        /* Styling the overall page (font and background) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #222222;
        }
        h2 {
            color: #2e8b57;
        }
        h3 {
            color: #8b0000;
        }
        a {
            color: #0000ee;
        }
    </style>
</head>
<body>
    <h2>Internal Linking</h2>
    <!-- Internal link: jumps to a section within the same page using an ID -->
    <p><a href="#section2">Go to Section 2</a></p>
    <h3>Section 1</h3>
    <p>This is the first section of the page.</p>
    <!-- The id is used as a target for internal linking -->
    <h3 id="section2">Section 2</h3>
    <p>This is the second section, linked internally using an anchor.</p>
    <hr>
    <h2>External Linking</h2>
    <!-- External link: opens another website in a new tab -->
    <p><a href="https://www.youtube.com" target="_blank">Visit YouTube</a></p>
</body>
</html>
