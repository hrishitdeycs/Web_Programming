
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple CSS Demo</title>
<style>
/* Page background and font */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 20px;
}
/* Heading (text styling) */
h1 {
    color: #2c3e50;
    text-align: center;
}
/* Paragraph text styling */
p {
    color: #333;
    font-size: 16px;
    line-height: 1.5;
}
/* div styling */
.box {
    background-color: white;
    padding: 15px;
    margin: 10px 0;
    border-left: 5px solid #3498db;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
/* List styling */
ul {
    background-color: #fff;
    padding: 15px;
    list-style-type: square;
}
li {
    margin: 5px 0;
    color: #2d3436;
}
/* Table styling */
table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
}
th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
}
th {
    background-color: #3498db;
    color: white;
}
/* Hover effect */
tr:hover {
    background-color: #f1f1f1;
}
</style>
</head>
<body>
<h1>CSS Styling Demo</h1>
<div class="box">
    <p>This is a styled div box with padding, border, and shadow.</p>
</div>
<p>This paragraph shows basic text styling using CSS.</p>
<h3>Sample List</h3>
<ul>
    <li>HTML Basics</li>
    <li>CSS Styling</li>
    <li>Web Design</li>
</ul>
<h3>Sample Table</h3>
<table>
<tr>
    <th>Name</th>
    <th>Age</th>
    <th>City</th>
</tr>
<tr>
    <td>Amit</td>
    <td>25</td>
    <td>Delhi</td>
</tr>
<tr>
    <td>Riya</td>
    <td>22</td>
    <td>Mumbai</td>
</tr>
</table>
</body>
</html>
