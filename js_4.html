<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
<h2>Student Registration Form</h2>
<form onsubmit="return validateForm()">
    Roll Number: <input type="text" id="roll"><br><br>
    Name: <input type="text" id="name"><br><br>
    Address:<br>
    <textarea id="address"></textarea><br><br>
    Course:
    <select id="course">
        <option value="">Select</option>
        <option>BCA</option>
        <option>BBA</option>
        <option>BTech</option>
    </select><br><br>
    Gender:
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female<br><br>
    Hobbies:
    <input type="checkbox" value="reading"> Reading
    <input type="checkbox" value="sports"> Sports<br><br>
    Date of Birth: <input type="date" id="dob"><br><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>
<script>
function validateForm() {
    var roll = document.getElementById("roll").value;
    var name = document.getElementById("name").value;
    var dob = document.getElementById("dob").value;
    var rollPattern = /^[0-9]{7}$/;
    var namePattern = /^[A-Za-z\s]+$/;
    if (!rollPattern.test(roll)) {
        alert("Roll number must be 7 digits");
        return false;
    }
    if (!namePattern.test(name)) {
        alert("Name should contain only alphabets");
        return false;
    }
    if (dob === "") {
        alert("Enter Date of Birth");
        return false;
    }
    alert("Form submitted");
    return true;
}
</script>
</body>
</html>
