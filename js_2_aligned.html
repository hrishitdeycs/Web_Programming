
<!DOCTYPE html>
<html>
  <head>
    <title>Calculator Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      form {
        background: #ffffff;
        padding: 20px 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .row {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }
      label {
        width: 120px;
      }
      input {
        width: 200px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin: 5px;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        background-color: #ccc;
        color: black;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #b3b3b3;
      }
    </style>
  </head>
  <body>
    <form>
      <!-- First number -->
      <div class="row">
        <label>First Number</label>
        <input type="text" id="num1">
      </div>
      <!-- Second number -->
      <div class="row">
        <label>Second Number</label>
        <input type="text" id="num2">
      </div>
      <!-- Buttons -->
      <div style="text-align:center;">
        <button type="button" onclick="calculate('+')">+</button>
        <button type="button" onclick="calculate('-')">-</button>
        <button type="button" onclick="calculate('*')">*</button>
        <button type="button" onclick="calculate('/')">/</button>
      </div>
    </form>
    <script>
      function calculate(operator) {
        const num1 = parseFloat(document.getElementById('num1').value);
        const num2 = parseFloat(document.getElementById('num2').value);
        if (isNaN(num1) || isNaN(num2)) {
          alert("Please enter valid numbers.");
          return;
        }
        let result;
        switch (operator) {
          case '+':
            result = num1 + num2;
            break;
          case '-':
            result = num1 - num2;
            break;
          case '*':
            result = num1 * num2;
            break;
          case '/':
            if (num2 === 0) {
              alert("Cannot divide by zero.");
              return;
            }
            result = num1 / num2;
            break;
        }
        alert("Result: " + result);
      }
    </script>
  </body>
</html>
