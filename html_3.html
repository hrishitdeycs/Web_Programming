<!DOCTYPE html>
<html>
<head>
    <title>Images in Webpages Demo</title>
</head>
<body>
    <!-- Logo Image -->
    <h2>Website Logo</h2>
    <img src="logo.png" alt="Logo" width="150">
    <hr>
    <!-- Image as Background of Table -->
    <h2>Table with Background Image</h2>
    <table style="border:1px solid black; width:300px; height:150px; background-image:url('background.jpg'); background-size:cover;">
        <tr>
            <td>Cell 1</td>
            <td>Cell 2</td>
        </tr>
        <tr>
            <td>Cell 3</td>
            <td>Cell 4</td>
        </tr>
    </table>
    <hr>
    <!-- Images in Table Cells -->
    <h2>Images inside Table Cells</h2>
    <table style="border:1px solid black; border-collapse:collapse;">
        <tr>
            <th>Fruit</th>
            <th>Image</th>
        </tr>
        <tr>
            <td>Apple</td>
            <td><img src="apple.jpg" width="100"></td>
        </tr>
        <tr>
            <td>Mango</td>
            <td><img src="mango.jpg" width="100"></td>
        </tr>
    </table>
    <hr>
    <!-- Clickable Image (Icon) -->
    <h2>Clickable Image Icon</h2>
    <a href="https://www.google.com">
        <img src="google_icon.png" alt="Google" width="100">
    </a>
</body>
</html>
